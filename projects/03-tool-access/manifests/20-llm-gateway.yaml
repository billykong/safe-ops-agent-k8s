# The LLM gateway (P3-02, P3-03): POST /v1/messages for the listed agent
# identities, authenticated by pod-bound tokens for audience
# llm-gateway.safe-ops.io; requests checked against policy and each
# identity's token budget; sent upstream with the provider key, which only
# this pod mounts. Upstream is the in-cluster mock provider by default;
# scripts/llm-gateway-mode.sh live switches to the real API and key. The
# local model (P5) goes to the self-hosted server instead, with its own key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: gateways
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-gateway}
  template:
    metadata:
      labels: {app: llm-gateway}
    spec:
      serviceAccountName: llm-gateway
      # Cilium's DNS proxy answers only the upstream names (30-networkpolicy).
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: gateway
        image: agent-gateway:dev
        imagePullPolicy: Never
        env:
        - {name: AUDIENCE, value: llm-gateway.safe-ops.io}
        - {name: ALLOWED_IDENTITIES, value: "system:serviceaccount:agent:runner,system:serviceaccount:agent:proposer,system:serviceaccount:evals:evaluator"}
        # How long a token review is reused: the most a revoked identity
        # can still get through after the kill switch.
        - {name: REVIEW_CACHE_TTL, value: 10s}
        # What may be sent: the agent's model and the eval judge's (a
        # different model, P4-11), the local model (P5), bounded output,
        # the refusal-fallback beta only.
        - {name: MODELS, value: "claude-opus-5-5,claude-sonnet-5-5,qwen2.5-1.5b-instruct"}
        - {name: MAX_TOKENS_CAP, value: "16000"}
        - {name: BETAS, value: server-side-fallback-2026-07-01}
        - {name: FALLBACKS, value: default}
        # Per identity: tokens per rolling window, and requests per minute.
        - {name: BUDGET_TOKENS, value: "200000"}
        - {name: BUDGET_WINDOW, value: 1h}
        - {name: REQUESTS_PER_MINUTE, value: "30"}
        - {name: UPSTREAM_URL, value: "http://mock-model.gateways.svc.cluster.local:8080"}
        - {name: UPSTREAM_TIMEOUT, value: 60s}
        - {name: API_KEY_FILE, value: /var/run/secrets/safe-ops.io/upstream/api-key}
        # The local model (P5), with its own key: vLLM in the cluster on the
        # GPU, behind the inference gateway (M2, M3), or outside it in Docker
        # (M1: http://172.30.99.10:8000); scripts/local-model-mode.sh
        # switches. Without the server its requests get 503
        # model_unavailable; the others are unaffected.
        - {name: ROUTES, value: "qwen2.5-1.5b-instruct=http://inference-gateway.inference.svc.cluster.local:8080"}
        - {name: ROUTE_PROVIDER, value: vllm}
        - {name: ROUTE_KEY_FILE, value: /var/run/secrets/safe-ops.io/local-model/api-key}
        # Cost estimate (P4-02): USD per million input:output tokens, cache
        # writes and reads at the provider's usual 1.25x and 0.1x of input.
        # List prices: keep them current, or the dashboards' costs drift.
        # Placeholders, not checked against the current price list.
        # The local model costs nothing per token (the GPU is ours).
        - {name: PRICES, value: "claude-opus-5-5=5:25,claude-sonnet-5-5=3:15,qwen2.5-1.5b-instruct=0:0"}
        # Traces to the collector; metrics on :9090 for Prometheus (P4).
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
        - {name: METRICS_LISTEN, value: ":9090"}
        ports:
        - {name: http, containerPort: 8080}
        - {name: metrics, containerPort: 9090}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 64Mi}
        volumeMounts:
        - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        - {name: provider-key, mountPath: /var/run/secrets/safe-ops.io/upstream, readOnly: true}
        - {name: local-model-key, mountPath: /var/run/secrets/safe-ops.io/local-model, readOnly: true}
      # API token projected explicitly for an hour; the automounted one is
      # valid for a year on this cluster (P3 README finding 2).
      volumes:
      # The provider key: mock-provider-key (make p3) or anthropic-api-key
      # (created by you, then scripts/llm-gateway-mode.sh live). Mounted
      # here only; the agents can't read Secrets in this namespace.
      - name: provider-key
        secret:
          secretName: mock-provider-key
          items: [{key: api-key, path: api-key}]
      # The local model's key, created by scripts/model-server.sh up.
      # Optional: the gateway runs without it, refusing that model only.
      - name: local-model-key
        secret:
          secretName: local-model-key
          optional: true
          items: [{key: api-key, path: api-key}]
      - name: kube-api
        projected:
          sources:
          - serviceAccountToken: {expirationSeconds: 3600, path: token}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
          - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: gateways
spec:
  selector: {app: llm-gateway}
  ports:
  - {name: http, port: 8080, targetPort: http}
  - {name: metrics, port: 9090, targetPort: metrics}
