# The MCP gateway (P3-04, P3-20, P3-21): the agents' only way to MCP tools.
# Its registry (servers, per-identity tools, descriptor pins, and a rule
# for every argument a tool takes) is this ConfigMap, kept in git and
# reviewed; regenerate pins for review with
#   kubectl exec -n gateways deploy/mcp-gateway -- /mcpgateway pins <server url>
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-registry
  namespace: gateways
data:
  registry.json: |
    {
      "servers": {
        "incidents": {
          "url": "http://incidents-mcp.mcp-servers.svc.cluster.local:8080/mcp",
          "secretHeader": "X-Tracker-Token",
          "secretFile": "/var/run/secrets/safe-ops.io/mcp/incidents/token",
          "tools": {
            "get_incident": "sha256:3a381e2b5a6d91585000af1cbfc18aff1784edc4b64ad77c73ff679839b18256",
            "list_open_incidents": "sha256:d553488ca8e729d4e1e5b1a99f50465ff1615082e9cf040b6f94f8b9530750ad"
          },
          "args": {
            "get_incident": {"incident_id": {"pattern": "INC-[0-9]{4,6}", "maxLength": 10}}
          }
        },
        "netdiag": {
          "url": "http://netdiag-mcp.mcp-servers.svc.cluster.local:8080/mcp",
          "tools": {
            "resolve": "sha256:32d32b7bfec47c199574023de05d4db1143a8b1a6c2dc02bde3f22fa67c8350d"
          },
          "args": {
            "resolve": {"hostname": {"pattern": "[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.(workloads)\\.svc\\.cluster\\.local", "maxLength": 100}}
          }
        }
      },
      "identities": {
        "system:serviceaccount:agent:proposer": {"incidents": ["list_open_incidents", "get_incident"], "netdiag": ["resolve"]}
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mcp-gateway, namespace: gateways}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: mcp-gateway-token-reviewer}
subjects:
- {kind: ServiceAccount, name: mcp-gateway, namespace: gateways}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: token-reviewer}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: gateways
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-gateway}
  template:
    metadata:
      labels: {app: mcp-gateway}
    spec:
      serviceAccountName: mcp-gateway
      automountServiceAccountToken: false
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: gateway
        image: mcp-gateway:dev
        imagePullPolicy: Never
        env:
        - {name: AUDIENCE, value: mcp-gateway.safe-ops.io}
        - {name: REGISTRY, value: /etc/safe-ops/mcp/registry.json}
        - {name: MAX_RESULT_BYTES, value: "16384"}
        # Traces to the collector; metrics on :9090 for Prometheus (P4).
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
        - {name: METRICS_LISTEN, value: ":9090"}
        ports: [{name: http, containerPort: 8080}, {name: metrics, containerPort: 9090}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 64Mi}
        volumeMounts:
        - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        - {name: registry, mountPath: /etc/safe-ops/mcp, readOnly: true}
        - {name: incidents-token, mountPath: /var/run/secrets/safe-ops.io/mcp/incidents, readOnly: true}
      volumes:
      - name: kube-api
        projected:
          sources:
          - serviceAccountToken: {expirationSeconds: 3600, path: token}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
          - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
      - name: registry
        configMap: {name: mcp-registry}
      # The tracker's token: only this pod (and the tracker) mount it.
      - name: incidents-token
        secret: {secretName: incident-tracker-token, items: [{key: token, path: token}]}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-gateway, namespace: gateways}
spec:
  selector: {app: mcp-gateway}
  ports: [{name: http, port: 8080, targetPort: http}, {name: metrics, port: 9090, targetPort: metrics}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mcp-gateway-from-agents, namespace: gateways}
spec:
  podSelector:
    matchLabels: {app: mcp-gateway}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: agent}
    ports: [{port: 8080, protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: mcp-gateway-egress, namespace: gateways}
spec:
  endpointSelector:
    matchLabels: {app: mcp-gateway}
  egress:
  - toEntities: [kube-apiserver]
    toPorts:
    - ports: [{port: "6443", protocol: TCP}]
  - toEndpoints:
    - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns}
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
      rules:
        dns: [{matchName: incidents-mcp.mcp-servers.svc.cluster.local}, {matchName: netdiag-mcp.mcp-servers.svc.cluster.local}]
  - toEndpoints:
    - matchLabels: {k8s:io.kubernetes.pod.namespace: mcp-servers, app: incidents-mcp}
    - matchLabels: {k8s:io.kubernetes.pod.namespace: mcp-servers, app: netdiag-mcp}
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
