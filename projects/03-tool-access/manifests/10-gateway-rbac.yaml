# The gateway may review tokens and nothing else: no reads, no writes. Not
# system:auth-delegator, which also grants SubjectAccessReviews.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: gateways
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-reviewer
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-gateway-token-reviewer
subjects:
- {kind: ServiceAccount, name: llm-gateway, namespace: gateways}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: token-reviewer}
