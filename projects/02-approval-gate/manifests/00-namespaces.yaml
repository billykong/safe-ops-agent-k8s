# approval-system: the controller (trusted; holds write credentials).
# approvals: where ChangeRequests live; the agent proposes here.
# workloads: what approved changes act on. The controller may write here;
# the agent may not.
apiVersion: v1
kind: Namespace
metadata:
  name: approval-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: approvals
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: workloads
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # Read by the semantic action gate (policy/gate.rego): the agent
    # pipeline may change this namespace, up to this many replicas each.
    safe-ops.io/agent-managed: "true"
    safe-ops.io/max-replicas: "20"
