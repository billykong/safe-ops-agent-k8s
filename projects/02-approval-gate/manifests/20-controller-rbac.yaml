# Binds the controller's generated roles (../config/rbac/role.yaml): read
# ChangeRequests and write their status, cluster-wide; get/patch Deployments
# in the workloads namespace only. Never cluster-admin (P2-03).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: approval-controller
  namespace: approval-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: approval-controller
subjects:
- kind: ServiceAccount
  name: approval-controller
  namespace: approval-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: approval-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: approval-controller
  namespace: workloads
subjects:
- kind: ServiceAccount
  name: approval-controller
  namespace: approval-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: approval-controller
