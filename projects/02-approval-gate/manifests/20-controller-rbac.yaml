# Binds the controller's generated roles (../config/rbac/role.yaml): read
# ChangeRequests and ChangeBudgets and write their status, cluster-wide;
# get/patch Deployments in the workloads namespace only; read ConfigMaps
# (the kill switch) in its own namespace. Never cluster-admin (P2-03).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: approval-controller
  namespace: approval-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: approval-controller
subjects:
- kind: ServiceAccount
  name: approval-controller
  namespace: approval-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: approval-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: approval-controller
  namespace: workloads
subjects:
- kind: ServiceAccount
  name: approval-controller
  namespace: approval-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: approval-controller
---
# Read-only access to the kill switch flag (90-kill-switch.yaml), which
# lives in the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: approval-controller
  namespace: approval-system
subjects:
- kind: ServiceAccount
  name: approval-controller
  namespace: approval-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: approval-controller
---
# For the metrics endpoint's authentication and authorization (P4-02):
# controller-runtime asks the API server who a scraper is and whether it
# may GET /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: approval-controller-metrics-auth
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: approval-controller-metrics-auth
subjects:
- kind: ServiceAccount
  name: approval-controller
  namespace: approval-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: approval-controller-metrics-auth
