apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-controller
  namespace: approval-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: approval-controller}
  template:
    metadata:
      labels: {app: approval-controller}
    spec:
      serviceAccountName: approval-controller
      automountServiceAccountToken: false
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: manager
        # Built by `make p2` and loaded into kind; never pulled.
        image: approval-controller:dev
        imagePullPolicy: Never
        # Health endpoint off: kubelet HTTP probes are dropped as "world" on
        # this cluster (P1 README finding 6). Metrics (oversight, P2-42;
        # gate decisions, P4-02) over HTTPS with a self-signed certificate,
        # and each scrape authenticated and authorized by the API server
        # (TokenReview, SubjectAccessReview on GET /metrics): Prometheus's
        # identity may, the agents' may not. Only Prometheus can connect
        # (P4 network policy). One replica, so no leader election.
        args: ["--metrics-bind-address=:8443", "--health-probe-bind-address=0",
               "--policy-file=/etc/safe-ops/policy/gate.rego"]
        # Traces (P4-01) go to the collector, the only name this pod may
        # resolve (P4's network policy).
        env:
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
        ports:
        - {name: metrics, containerPort: 8443}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 128Mi}
        volumeMounts:
        # The semantic action gate's policy (policy/gate.rego, published as
        # ConfigMap approval-policy by `make p2`).
        - {name: policy, mountPath: /etc/safe-ops/policy, readOnly: true}
        - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      # API token projected explicitly for an hour; the automounted one is
      # valid for a year on this cluster (P3 README finding 2).
      volumes:
      - name: policy
        configMap: {name: approval-policy, optional: true}
      - name: kube-api
        projected:
          sources:
          - serviceAccountToken: {expirationSeconds: 3600, path: token}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
          - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
---
apiVersion: v1
kind: Service
metadata:
  name: approval-controller-metrics
  namespace: approval-system
spec:
  selector: {app: approval-controller}
  ports:
  - {name: metrics, port: 8443, targetPort: metrics}
