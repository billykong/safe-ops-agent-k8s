# Temporal's single-binary development server, with its state in SQLite on
# a volume, so workflows survive the server's restarts too. Fine for one
# node and a demo; production would run the Temporal services against
# Postgres/Cassandra with mTLS (docs/known-gaps.md GAP-03).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
  namespace: temporal
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
spec:
  replicas: 1
  # One writer for the SQLite file: never two servers at once.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      automountServiceAccountToken: false
      # No DNS. The server needs none (it talks to itself on localhost),
      # but its gRPC clients still look up TXT/SRV records for "localhost"
      # through the search domains. With egress denied those queries were
      # dropped, every internal call waited out the DNS timeout, and the
      # server never became healthy. A resolver on 127.0.0.1, where nothing
      # listens, fails them at once instead.
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
        searches: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: temporal
        image: temporalio/temporal:1.9.1
        imagePullPolicy: IfNotPresent
        args:
        - server
        - start-dev
        - --ip=0.0.0.0
        - --db-filename=/data/temporal.db
        # The web UI listens too, reachable only by port-forward (the
        # network policy admits 7233 from the worker and nothing else):
        # kubectl port-forward -n temporal deploy/temporal 8233
        - --ui-port=8233
        - --log-level=warn
        ports:
        - {name: grpc, containerPort: 7233}
        - {name: ui, containerPort: 8233}
        # An exec probe, not tcpSocket: under this Cilium setup the kubelet's
        # probes reach pods as "world", and the namespace's default-deny
        # ingress drops them.
        readinessProbe:
          exec:
            command: [temporal, operator, cluster, health, --address, "127.0.0.1:7233"]
          periodSeconds: 5
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 768Mi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: temporal-data}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal
spec:
  selector: {app: temporal}
  ports:
  - {name: grpc, port: 7233, targetPort: grpc}
