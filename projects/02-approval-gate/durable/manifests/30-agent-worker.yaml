# The agent as a long-running Temporal worker (P2-30), as the proposer
# identity: it may propose ChangeRequests, not claim sandboxes. The write
# guard and kill switch cover it like every identity in the namespace. It holds no state; the workflow history in Temporal does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent-worker}
  template:
    metadata:
      labels: {app: agent-worker}
    spec:
      serviceAccountName: proposer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      # Cilium's DNS proxy answers only the Temporal name for this pod;
      # with the default ndots:5, the resolver would try search-domain
      # variants first and be refused (P1 finding).
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      containers:
      - name: worker
        image: approval-agent:dev
        imagePullPolicy: Never
        env:
        - {name: TEMPORAL_ADDRESS, value: "temporal.temporal.svc.cluster.local:7233"}
        - {name: LLM_GATEWAY_URL, value: "http://llm-gateway.gateways.svc.cluster.local:8080"}
        - {name: LLM_GATEWAY_TOKEN_FILE, value: /var/run/secrets/safe-ops.io/llm-gateway/token}
        # MCP tools, only through the MCP gateway (P3-04): server=url pairs.
        - {name: MCP_SERVERS, value: "incidents=http://mcp-gateway.gateways.svc.cluster.local:8080/mcp/incidents"}
        - {name: MCP_GATEWAY_TOKEN_FILE, value: /var/run/secrets/safe-ops.io/mcp-gateway/token}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
        - {name: llm-gateway-token, mountPath: /var/run/secrets/safe-ops.io/llm-gateway, readOnly: true}
        - {name: mcp-gateway-token, mountPath: /var/run/secrets/safe-ops.io/mcp-gateway, readOnly: true}
      volumes:
      - name: tmp
        emptyDir: {}
      # The API token, projected explicitly instead of automounted: the
      # automounted one is valid for a year on this cluster (the API server
      # extends tokens requested with the automount default,
      # --service-account-extend-token-expiration), this one for an hour.
      # Same path and files as the automounted volume.
      - name: kube-api
        projected:
          sources:
          - serviceAccountToken: {expirationSeconds: 3600, path: token}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
          - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
      # The proposer's identity for the LLM gateway (P3-01): audience-bound,
      # pod-bound, 10-minute token, refreshed by the kubelet.
      - name: llm-gateway-token
        projected:
          sources:
          - serviceAccountToken: {audience: llm-gateway.safe-ops.io, expirationSeconds: 600, path: token}
      # And for the MCP gateway: its own audience, so neither gateway can
      # replay a token at the other.
      - name: mcp-gateway-token
        projected:
          sources:
          - serviceAccountToken: {audience: mcp-gateway.safe-ops.io, expirationSeconds: 600, path: token}
---
# The worker reaches the API server, one DNS name, and Temporal's frontend.
# Not the sandboxes: the agent Job runs code there, the worker doesn't.
# Everything else stays denied by the agent namespace's default-deny.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-worker-egress
  namespace: agent
spec:
  endpointSelector:
    matchLabels: {app: agent-worker}
  egress:
  - toEntities: [kube-apiserver]
    toPorts:
    - ports: [{port: "6443", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - {port: "53", protocol: UDP}
      - {port: "53", protocol: TCP}
      rules:
        dns:
        - matchName: temporal.temporal.svc.cluster.local
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: temporal
        app: temporal
    toPorts:
    - ports: [{port: "7233", protocol: TCP}]
