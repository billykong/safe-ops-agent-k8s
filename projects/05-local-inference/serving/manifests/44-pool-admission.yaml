# Who may join the pool (P5-07). The InferencePool selects its pods by a
# label (app=local-model), and the network policies admit the proxy and
# the endpoint picker by theirs: a hand-made pod in namespace inference
# wearing one would receive prompts, or reach vLLM. So those labels are for
# pods the ReplicaSet controller makes, from the Deployments here; a pod
# created by anyone else, or relabelled later, is refused. Who may change
# the Deployments is RBAC's to decide (cluster admins).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: inference-pool-membership
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: inference}
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      operations: ["CREATE", "UPDATE"]
  variables:
  - name: reserved
    expression: "['app', 'gateway.networking.k8s.io/gateway-name']"
  - name: wears
    expression: >-
      has(object.metadata.labels) && (
        object.metadata.labels.exists(k, k == 'gateway.networking.k8s.io/gateway-name') ||
        (has(object.metadata.labels.app) && object.metadata.labels.app in ['local-model', 'local-model-epp']))
  - name: wore
    expression: >-
      oldObject != null && has(oldObject.metadata.labels) && (
        oldObject.metadata.labels.exists(k, k == 'gateway.networking.k8s.io/gateway-name') ||
        (has(oldObject.metadata.labels.app) && oldObject.metadata.labels.app in ['local-model', 'local-model-epp']))
  validations:
  - expression: >-
      request.operation != 'CREATE' || !variables.wears ||
      request.userInfo.username == 'system:serviceaccount:kube-system:replicaset-controller'
    messageExpression: >-
      'the serving stack\'s labels (app=local-model, app=local-model-epp, gateway.networking.k8s.io/gateway-name) are for pods its Deployments make, not ' + request.userInfo.username
  - expression: >-
      request.operation != 'UPDATE' || !variables.wears || variables.wore &&
      variables.reserved.all(k, (has(object.metadata.labels) && k in object.metadata.labels ? object.metadata.labels[k] : '') ==
                                (has(oldObject.metadata.labels) && k in oldObject.metadata.labels ? oldObject.metadata.labels[k] : ''))
    message: the serving stack's labels can't be added to or changed on a running pod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: inference-pool-membership
spec:
  policyName: inference-pool-membership
  validationActions: [Deny]
