# The runner agent may only claim, read and release sandboxes, and read a Sandbox
# to find its pod IP. Nothing else: no pods, exec, secrets, or creating
# Sandboxes directly (which would bypass the hardened template). No
# update/patch either, so a claim can't be changed after admission.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-claimer
  namespace: sandboxes
rules:
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["create", "get", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-claimer
  namespace: sandboxes
subjects:
- kind: ServiceAccount
  name: runner
  namespace: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-claimer
