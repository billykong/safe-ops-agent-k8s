apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-gvisor
  namespace: sandboxes
spec:
  # The default ("Managed") makes the controller create a NetworkPolicy per
  # template that allows egress to the whole public internet. Policies are
  # additive, so it silently overrides 20-networkpolicy.yaml. We own policy.
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runtime
        # Built by `make executor-image` and loaded into kind; never pulled.
        image: sandbox-executor:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8888
        # exec, not httpGet: without Cilium's iptables rules (see
        # cluster/cilium-values.yaml) node-originated traffic is classified
        # as "world", so default-deny drops kubelet HTTP probes. An exec
        # probe also means the sandbox takes no traffic from the node at all.
        readinessProbe:
          exec:
            command: ["python", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=1)"]
          periodSeconds: 5
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
          limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 128Mi}
        volumeMounts:
        - name: scratch
          mountPath: /tmp
      volumes:
      - name: scratch
        emptyDir:
          sizeLimit: 64Mi
