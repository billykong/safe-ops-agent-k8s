# Prometheus (P4-02): scrapes the gateways and the approval controller,
# and takes the agent's OTLP metrics from the collector (its OTLP
# endpoint, which only the collector can reach). Data on an emptyDir for
# 7 days: a restart empties it (a lab trade-off).
#
# The controller's metrics need a token: its endpoint authenticates and
# authorizes each scrape (TokenReview, SubjectAccessReview), and this
# identity may get /metrics and nothing else. The gateways' metrics are
# on a port that only this pod may reach (network policy).
#
# The alerting rules (alerts.yml) watch the audit sink's counters (P4-04),
# and whether oversight is working and the agent is still good (P4-21,
# P4-22): rubber-stamp approvals, overridden critical findings, reopened
# changes, and the latest eval run. And the local GPU's health (P5-06).
# There's no Alertmanager here: alerts show in Prometheus's alerts page
# and API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: safe-ops-metrics-reader
rules:
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-metrics-reader
subjects:
- {kind: ServiceAccount, name: prometheus, namespace: observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: safe-ops-metrics-reader}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    otlp:
      translation_strategy: UnderscoreEscapingWithSuffixes
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
    - job_name: llm-gateway
      static_configs: [{targets: [llm-gateway.gateways.svc.cluster.local:9090]}]
    - job_name: mcp-gateway
      static_configs: [{targets: [mcp-gateway.gateways.svc.cluster.local:9090]}]
    - job_name: approval-controller
      scheme: https
      # controller-runtime's self-signed serving certificate (P2 manifests).
      tls_config: {insecure_skip_verify: true}
      authorization:
        credentials_file: /var/run/secrets/safe-ops.io/prometheus/token
      static_configs: [{targets: [approval-controller-metrics.approval-system.svc.cluster.local:8443]}]
    - job_name: audit-sink
      static_configs: [{targets: [audit-sink.audit.svc.cluster.local:9090]}]
    # The local model's endpoint picker (P5 M3): the pool's queue and KV
    # cache, which KEDA scales vLLM on. Same token and role as the
    # controller's metrics. Down (no target) until P5 is installed.
    - job_name: local-model-epp
      authorization:
        credentials_file: /var/run/secrets/safe-ops.io/prometheus/token
      static_configs: [{targets: [local-model-epp.inference.svc.cluster.local:9090]}]
    # The GPU (P5 M4): NVIDIA's DCGM exporter, whole-device counters. Only
    # this pod may reach it (network policy). Down until P5 is installed.
    - job_name: gpu
      static_configs: [{targets: [gpu-metrics.inference.svc.cluster.local:9400]}]
    # The API server's own audit counters: events it gave up delivering to
    # the sink (P4-04). Same token and role as the controller's metrics.
    - job_name: kube-apiserver
      scheme: https
      tls_config: {ca_file: /var/run/secrets/safe-ops.io/prometheus/ca.crt}
      authorization:
        credentials_file: /var/run/secrets/safe-ops.io/prometheus/token
      static_configs: [{targets: [kubernetes.default.svc.cluster.local:443]}]
      metric_relabel_configs:
      - {source_labels: [__name__], regex: "apiserver_audit_.*", action: keep}
  alerts.yml: |
    groups:
    - name: safe-ops-audit
      rules:
      # GAP-02: in-cluster admission control can be removed by whoever may
      # edit it. Detect it: any change to admission configuration pages.
      - alert: AdmissionConfigChanged
        expr: sum by (resource, actor) (increase(safeops_audit_changes_total{resource=~"(validating|mutating)(webhookconfigurations|admissionpolicies|admissionpolicybindings)"}[15m])) > 0
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.actor }} changed {{ $labels.resource }}: check the audit log"
      - alert: GuardConfigChanged
        expr: sum by (resource, actor) (increase(safeops_audit_changes_total{resource=~"roles|rolebindings|clusterroles|clusterrolebindings|networkpolicies|ciliumnetworkpolicies|ciliumclusterwidenetworkpolicies|kill-switch"}[15m])) > 0
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.actor }} changed {{ $labels.resource }}"
      # The agent asked the API server for something its RBAC doesn't
      # allow: a bug, or an injected instruction trying.
      - alert: AgentRequestForbidden
        expr: sum(increase(safeops_audit_events_total{actor="agent",outcome="forbidden"}[15m])) > 0
        labels: {severity: ticket}
        annotations:
          summary: "the agent was refused by the API server {{ $value | humanize }} times in 15m"
      - alert: AuditChainBroken
        expr: safeops_audit_chain_verified == 0
        labels: {severity: page}
        annotations:
          summary: "the audit chain on disk doesn't match what the sink wrote: edited or cut"
      # The API server retries a failed batch for about 45s, then drops it
      # from the webhook; those events are only in the node's log (GAP-07).
      - alert: AuditEventsDropped
        expr: sum(increase(apiserver_audit_error_total{plugin="webhook"}[15m])) > 0
        labels: {severity: page}
        annotations:
          summary: "{{ $value | humanize }} audit events didn't reach the sink; the node's log has them"
      - alert: AuditSinkDown
        expr: up{job="audit-sink"} == 0 or absent(up{job="audit-sink"})
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "the audit sink is down; events reach only the node's log"
    # Oversight health (P4-21) and quality (P4-22), from the controller's
    # metrics: derived from the ChangeRequests and EvalRuns kept in the
    # cluster, which the agent can't write or forge.
    - name: safe-ops-oversight
      rules:
      # Approving nearly everything, quickly, over enough decisions to
      # mean something: the approver is likely not reading the packet.
      - alert: RubberStampApprovals
        expr: |
          (sum by (approver) (safeops_approver_decisions{decision="approved"}) / sum by (approver) (safeops_approver_decisions) >= 0.95)
          and on (approver) (sum by (approver) (safeops_approver_decisions) >= 10)
          and on (approver) (safeops_approver_decision_seconds{quantile="0.5"} < 30)
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.approver }} approves {{ $value | humanizePercentage }} of requests, with a median review under 30s"
      # A human approved a request the review rules marked Critical
      # (approvalctl approve --accept-critical): an override, to be looked at.
      # The metric is a gauge whose series appears with an approver's first
      # decision: a new series above zero counts as well as a rise.
      - alert: CriticalFindingApproved
        expr: |
          (safeops_approver_approvals_flagged{severity="critical"} > 0
            unless safeops_approver_approvals_flagged{severity="critical"} offset 15m)
          or
          (safeops_approver_approvals_flagged{severity="critical"}
            > safeops_approver_approvals_flagged{severity="critical"} offset 15m)
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.approver }} approved a request with a Critical finding"
      - alert: ChangesReopened
        expr: (safeops_changerequests_reopened / safeops_changerequests_applied > 0.2) and on () (safeops_changerequests_applied >= 5)
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value | humanizePercentage }} of applied changes were followed within an hour by another for the same target"
      - alert: EvalSafetyNotHeld
        expr: safeops_eval_last_run_safety_held == 0
        labels: {severity: page}
        annotations:
          summary: "safety didn't hold in eval run {{ $labels.run }}: something unsafe got through"
    # The local GPU (P5-06), from the DCGM exporter. Tickets, not pages:
    # the local model is a judge and a fallback, not the agent's model.
    - name: local-inference
      rules:
      - alert: GPUMetricsDown
        expr: (up{job="gpu"} == 0 or absent(up{job="gpu"})) and on () (up{job="local-model-epp"} == 1)
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "no GPU metrics: the DCGM exporter in namespace inference is down or can't read the GPU"
      # vLLM's KV cache is fixed (400 MiB a replica), so memory that keeps
      # climbing is something else on the GPU: under WSL2 that includes
      # Windows itself.
      - alert: GPUMemoryNearlyFull
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE + DCGM_FI_DEV_FB_RESERVED) > 0.9
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory {{ $value | humanizePercentage }} used: a second vLLM replica may not fit"
      # A laptop part: it throttles in the high 80s.
      - alert: GPUHot
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "GPU {{ $labels.gpu }} at {{ $value }}C: expect throttled clocks and slower answers"
      # The GPU is busy and requests still wait at both replicas: the
      # local model is at capacity, and KEDA has nothing left to add.
      - alert: LocalModelAtCapacity
        expr: |
          avg_over_time(DCGM_FI_DEV_GPU_UTIL[10m]) > 90
          and on () (sum(llm_d_epp_average_queue_size{name="local-model"} * on(name) llm_d_epp_ready_endpoints{name="local-model"}) > 0)
          and on () (sum(llm_d_epp_ready_endpoints{name="local-model"}) >= 2)
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "the local model is at capacity: GPU busy, both replicas up, requests still queueing"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: prometheus
        image: prom/prometheus:v3.13.3
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --web.enable-otlp-receiver
        ports:
        - {name: http, containerPort: 9090}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus, readOnly: true}
        - {name: data, mountPath: /prometheus}
        - {name: token, mountPath: /var/run/secrets/safe-ops.io/prometheus, readOnly: true}
      volumes:
      - name: config
        configMap: {name: prometheus}
      - name: data
        emptyDir: {sizeLimit: 2Gi}
      # For the controller's and the API server's metrics: the API
      # server's audience (the controller runs a TokenReview), an hour,
      # refreshed by the kubelet; and the cluster CA for the API server.
      - name: token
        projected:
          sources:
          - serviceAccountToken: {expirationSeconds: 3600, path: token}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector: {app: prometheus}
  ports:
  - {name: http, port: 9090, targetPort: http}
