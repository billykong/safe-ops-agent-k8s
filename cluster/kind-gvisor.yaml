# Single-node kind cluster with gVisor available as RuntimeClass "gvisor".
# The host's runsc binaries (from scripts/setup-host.sh) are mounted into the
# node, and the node's containerd gets a "runsc" runtime handler.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: safe-ops
networking:
  # kindnet's NetworkPolicy engine needs CONFIG_NFT_QUEUE, which the stock
  # WSL2 kernel lacks, so policies silently go unenforced. Cilium (eBPF)
  # replaces it; see cluster/cilium-values.yaml.
  disableDefaultCNI: true
  # Cilium replaces kube-proxy too, so its datapath needs no iptables modules
  # the WSL2 kernel lacks.
  kubeProxyMode: none
nodes:
- role: control-plane
  # Red-flag scan note: these hostPaths are kind node mounts (host -> node
  # container), read-only gVisor binaries. They are not pod hostPath volumes;
  # no workload pod mounts host paths.
  extraMounts:
  - hostPath: /usr/bin/runsc
    containerPath: /usr/local/bin/runsc
    readOnly: true
  - hostPath: /usr/bin/containerd-shim-runsc-v1
    containerPath: /usr/local/bin/containerd-shim-runsc-v1
    readOnly: true
  # Recent runsc releases split the Sentry and helpers into sidecar binaries
  # that runsc looks up in gvisor-bin/ next to itself.
  - hostPath: /usr/bin/gvisor-bin
    containerPath: /usr/local/bin/gvisor-bin
    readOnly: true
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    # Node-wide cap on processes per pod: the systemic answer to a fork bomb.
    podPidsLimit: 512
# kind node images ship a version = 2 config (migrated by containerd 2.x), so
# use the v2 key; the v3 "io.containerd.cri.v1.runtime" key is silently ignored.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
    runtime_type = "io.containerd.runsc.v1"
